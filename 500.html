<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="robots" content="noindex, nofollow">
  <title>Something went wrong | NGXLab</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.6 Inter, ui-sans-serif, system-ui, sans-serif;
      background: #f5f2e9;
      color: #173a2b;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    header { padding: 18px max(24px, calc((100% - 1050px) / 2)); border-bottom: 1px solid #d9dfd3; }
    a { color: inherit; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 760; }
    .brand-mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 11px 11px 11px 3px; background: #173a2b; color: #d3ed75; font-size: 19px; }
    .brand-name span { color: #638735; }
    main { min-height: calc(100vh - 72px); display: grid; place-items: center; padding: 32px 19px; }
    article { width: min(100%, 560px); padding: clamp(26px, 6vw, 48px); border: 1px solid #d9dfd3; border-radius: 12px; background: #fffcf4; }
    .code { margin: 0 0 12px; color: #638044; font-size: 11px; font-weight: 740; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 8vw, 46px); letter-spacing: -1.7px; line-height: 1.12; }
    article > p:not(.code) { max-width: 430px; margin: 15px 0 0; color: #5b6a60; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-top: 25px; }
    .primary { display: inline-flex; min-height: 48px; align-items: center; padding: 0 19px; border-radius: 7px; background: #d3ed75; color: #102a20; font-size: 13px; font-weight: 680; text-decoration: none; }
    .reference { margin-top: 22px !important; font-size: 11px; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      :root { background: #101713; color: #e4ece5; }
      header { border-color: #35433a; }
      article { border-color: #35433a; background: #1a241e; }
      .brand-name span, .code { color: #b4d48a; }
      article > p:not(.code) { color: #aab8ad; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="NGXLab home">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span class="brand-name">NGX<span>Lab</span></span>
    </a>
  </header>
  <main>
    <article aria-labelledby="error-title">
      <p class="code">500 · Temporary problem</p>
      <h1 id="error-title">We couldn’t load this page.</h1>
      <p>Something went wrong on our end. Please try again in a moment, or return to the NGXLab home page.</p>
      <nav aria-label="Recovery links">
        <a class="primary" href="/">Back to home</a>
        <a href="/">Try again</a>
      </nav>
      <p class="reference">Request ID: ::vercel:REQUEST_ID::<br>Error: ::vercel:ERROR_CODE::</p>
    </article>
  </main>
</body>
</html>
