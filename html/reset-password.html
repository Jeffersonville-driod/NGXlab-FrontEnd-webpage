<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Set a new password for your NGXLab account.">
  <title>Reset password | NGXLab</title>
  <link rel="icon" href="../favicon.svg?v=6" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-page-card" aria-labelledby="reset-title">
      <div class="drawer-layout">
        <header class="drawer-header">
          <a class="brand" href="index.html" aria-label="NGXLab home">
            <span class="brand-mark" aria-hidden="true">N</span>
            <span class="brand-name">NGX<span>Lab</span></span>
          </a>
        </header>
        <div class="drawer-content">
          <p class="drawer-eyebrow">Account access</p>
          <h1 id="reset-title">Set a new password</h1>
          <p class="drawer-intro">Choose a new password for your NGXLab account.</p>

          <form class="auth-form" id="reset-password-form">
            <label class="auth-field" for="reset-password">New password</label>
            <div class="auth-password-control">
              <input class="auth-input" id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
              <button class="auth-password-toggle" type="button" data-password-toggle aria-controls="reset-password" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <label class="auth-field" for="reset-password-confirm">Confirm new password</label>
            <div class="auth-password-control">
              <input class="auth-input" id="reset-password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Enter your new password again" required>
              <button class="auth-password-toggle" type="button" data-password-toggle aria-controls="reset-password-confirm" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <button class="auth-submit" type="submit"><span class="button-spinner" aria-hidden="true" hidden></span>Update password</button>
          </form>

          <p class="auth-status" id="reset-password-status" role="status" aria-live="polite"></p>
          <p class="auth-secondary"><a class="auth-link-button" href="login.html">Back to log in</a></p>
        </div>
        <div class="drawer-bottom">NGXLab is a learning concept. Practice examples are illustrative, not financial advice.</div>
      </div>
    </section>
  </main>
  <script type="module" src="../js/reset-password-page.js"></script>
  <script type="module" src="../js/theme.js"></script>
</body>
</html>
